name: Publish Stilltime web app

on:
  push:
    branches: [main]
    paths:
      - 'Timer/**'
      - 'Timer.Core/**'
      - 'Timer.Browser/**'
      - 'Timer.Android/Icon.png'
      - 'Directory.Packages.props'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stilltime-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload restore Timer.Browser/Timer.Browser.csproj
      - run: dotnet publish Timer.Browser/Timer.Browser.csproj -c Release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Timer.Browser/bin/Release/net10.0-browser/publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
