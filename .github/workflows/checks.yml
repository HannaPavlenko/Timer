name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Timer.Desktop -c Release
      - run: dotnet test Timer.Core.Tests -c Release
      - run: dotnet test Timer.App.Tests -c Release
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload restore Timer.Android/Timer.Android.csproj
      - run: dotnet build Timer.Android/Timer.Android.csproj -c Debug
